yolo:
  model: "yolo11n.pt"
  epochs: 60
  imgsz: 800
  batch: 32
  conf: 0.35
  iou: 0.50
  project: "Runs/hybrid"
  name: "yolo11n_circuits"
wire_tracer:
  bbox_margin: 6
  touch_dist: 10
  min_net_pixels: 30
ocr:
  enabled: true
  gpu: true
  search_margin: 90
data:
  dataset_dir: "Data"
  train_json: "Data/finetune/train_conversations.json"
  test_json: "Data/finetune/test_conversations.json"
evaluation:
  n_samples: 500
  wandb_project: "circuitvqa"
  wandb_dir: "/tmp"
